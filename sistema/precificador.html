<title>Precificador Bonati</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: faixa vinho com a marca Bonati + abas; área de trabalho branca com tabela rolável e painel de detalhe. Tema único claro (identidade Bonati). */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --sunk:#FBF8F4; --ink:#241017; --muted:#6B5B62; --line:#EADFE3;
  --wine:#5B0A2D; --wine-dark:#3A0620; --gold:#C9A466; --gold-light:#F7D18E;
  --gold-grad:linear-gradient(135deg,#C9A466 0%,#F7D18E 50%,#CAA467 100%);
  --accent:#5B0A2D; --accent-ink:#FFFFFF; --accent-soft:#F6ECEF;
  --ok:#1E7A4C; --ok-soft:#DDF1E5; --warn:#8A5A00; --warn-soft:#FBEBCB; --bad:#B23A2E; --bad-soft:#F7DEDA;
  --f-display:"Cormorant Garamond","Playfair Display",Georgia,serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--wine)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--wine);color:#FFFFFF;border-bottom:3px solid transparent;border-image:var(--gold-grad) 1}
.top-row{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px}
.brand img{height:42px;width:auto}
.brand-txt{display:grid;line-height:1.05}
.brand-txt b{font-family:var(--f-display);font-weight:700;font-size:22px;color:var(--gold-light);letter-spacing:.01em}
.brand-txt small{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#E9D9DF}
.cli .label{color:#E9D9DF}
header.top select{background:var(--wine-dark);color:#FFFFFF;border-color:rgba(247,209,142,.5)}
header.top #btnNovoCli{background:transparent;color:var(--gold-light);border-color:rgba(247,209,142,.6)}
header.top #btnNovoCli:hover{border-color:var(--gold-light)}
.cli{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
nav.tabs{display:flex;gap:4px;margin-left:auto}
nav.tabs a{padding:7px 12px;border-radius:6px;color:#E9D9DF;text-decoration:none;font-weight:500}
nav.tabs a[aria-current="page"]{background:var(--gold-grad);color:var(--wine-dark)}
nav.tabs a:hover{color:#FFFFFF}
header.top :focus-visible{outline-color:var(--gold-light)}
main{padding-block:20px 48px;display:grid;gap:18px}
h1{font-family:var(--f-display);font-size:30px;font-weight:700;margin:0;text-wrap:balance;color:var(--wine);line-height:1.1}
h2{font-family:var(--f-display);font-size:21px;font-weight:700;margin:0;color:var(--wine)}
.sub{color:var(--muted);margin:2px 0 0}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
button,.btn{font:inherit;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--muted)}
button.primary{background:var(--wine);color:#FFFFFF;border-color:var(--wine)}
button.primary:hover{background:var(--wine-dark)}
button.danger{color:var(--bad);border-color:var(--bad)}
button.link{border:0;background:none;padding:2px 4px;color:var(--accent);text-decoration:underline}
button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0}
input.n{font-family:var(--f-num);text-align:right;width:90px}
textarea{width:100%;font-family:var(--f-num);font-size:12px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:end;justify-content:space-between}
.toolbar .grp{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.field{display:grid;gap:4px}
.margem-box{display:flex;align-items:center;gap:10px;background:var(--sunk);border:1px solid var(--gold);border-radius:10px;padding:8px 12px;box-shadow:0 10px 30px -14px rgba(201,164,102,.6)}
.margem-box input{font-family:var(--f-num);font-size:20px;width:84px;text-align:right;border:2px solid var(--gold);color:var(--wine);font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 30px -24px rgba(91,10,45,.35)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;vertical-align:middle}
thead th{position:sticky;top:0;background:var(--sunk);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
th.grp{text-align:center;border-left:1px solid var(--line);color:var(--wine);background:var(--accent-soft)}
td.r,th.r{text-align:right}
td.bl,th.bl{border-left:1px solid var(--line)}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--sunk)}
tbody tr.sel td{background:var(--accent-soft)}
td.nome{max-width:280px;overflow:hidden;text-overflow:ellipsis}
.sku{font-family:var(--f-num);font-weight:500}
.sug{font-weight:600;color:var(--wine)}
.chip.promo{background:#FBF1DC;color:var(--wine);margin-left:6px;font-family:var(--f-body);font-size:11px;border:1px solid var(--gold)}
td.ck,th.ck{width:30px;padding-right:0}
select.cell-sel{font-size:13px;padding:3px 6px;border:1px dashed var(--line);background:transparent;max-width:150px}
select.cell-sel:hover{border-color:var(--gold)}
.bulk{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 14px;border:1px solid var(--gold);background:#FBF1DC;border-radius:10px}
.promo-cmp{display:grid;gap:4px;padding:8px 10px;border-radius:8px;background:var(--sunk);font-size:13px}
.promo-cmp span{display:flex;justify-content:space-between;gap:8px}
tr.grp-row td{background:var(--sunk);border-top:2px solid var(--line);padding:7px 10px;cursor:default}
.grp-in{position:sticky;left:10px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;width:max-content;max-width:min(1100px,calc(100vw - 72px))}
.grp-in .sku{font-size:14.5px;color:var(--wine)}
.gnome{max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.gf{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;white-space:nowrap}
button.tog{border:0;background:none;padding:0 4px;font-size:15px;color:var(--wine);line-height:1}
td.mlbc,th.mlbc{position:sticky;left:30px;z-index:1;background:var(--surface);box-shadow:1px 0 0 var(--line)}
thead th.mlbc{background:var(--sunk);z-index:2}
tbody tr:hover td.mlbc{background:var(--sunk)}tbody tr.sel td.mlbc{background:var(--accent-soft)}
input.cell.txt{width:140px;text-align:left;font-family:var(--f-num)}
input.cell.fam{width:140px}
.sub{font-size:10.5px;color:var(--muted);font-family:var(--f-num);padding:1px 0 0 7px}
button.muted-btn{color:var(--muted)}button.danger-t{color:var(--bad)}
td.fams{max-width:260px;overflow:hidden;text-overflow:ellipsis}
tr.anu-vazio td{padding:10px}
input.cell.date{width:128px;font-family:var(--f-num);font-size:12px}
input.cell.exp{text-decoration:line-through;color:var(--muted)}
td.ck,th.ck{position:sticky;left:0;z-index:1;background:var(--surface)}
td.sku{position:sticky;left:30px;z-index:1;background:var(--surface);box-shadow:1px 0 0 var(--line)}
thead th.ck{background:var(--sunk);z-index:2}
tbody tr:hover td.ck,tbody tr:hover td.sku{background:var(--sunk)}
tbody tr.sel td.ck,tbody tr.sel td.sku{background:var(--accent-soft)}
input.cell{width:96px;padding:3px 6px;font-size:13px;border:1px dashed var(--line);background:transparent}
input.cell:hover{border-color:var(--gold)}
input.cell:focus{border:1px solid var(--wine);background:var(--surface)}
.chip{display:inline-block;padding:1px 7px;border-radius:999px;font-family:var(--f-num);font-size:12px;font-weight:500}
.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.bad{background:var(--bad-soft);color:var(--bad)}
.muted{color:var(--muted)}
.tag{font-size:11px;padding:1px 6px;border-radius:4px;background:var(--sunk);color:var(--muted);margin-left:6px}
.summary{display:flex;flex-wrap:wrap;gap:8px 18px;color:var(--muted);font-size:13px}
.summary b{color:var(--ink);font-family:var(--f-num);font-weight:500}
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
@media (min-width:1180px){.layout.has-detail{grid-template-columns:minmax(0,1fr) 380px}}
.detail{padding:16px;display:grid;gap:14px;align-self:start;position:sticky;top:76px}
.detail-head{display:flex;justify-content:space-between;gap:10px;align-items:start}
.canal-tabs{display:flex;flex-wrap:wrap;gap:4px}
.canal-tabs button{padding:5px 9px;font-size:13px}
.canal-tabs button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.dre{display:grid;gap:0}
.dre div{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed var(--line)}
.dre div.tot{border-bottom:0;border-top:1px solid var(--ink);font-weight:600;margin-top:2px}
.dre span:last-child{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.sim{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cards{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.card{padding:16px;display:grid;gap:12px;align-content:start}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.row2{display:flex;flex-wrap:wrap;gap:12px}
.note{font-size:12.5px;color:var(--muted);margin:0}
.warnbox{background:var(--warn-soft);color:var(--ink);border-radius:6px;padding:8px 10px;font-size:13px}
.empty{padding:40px 20px;text-align:center;color:var(--muted);display:grid;gap:10px;justify-items:center}
.overlay{position:fixed;inset:0;background:rgba(10,15,12,.45);display:grid;place-items:center;z-index:20;padding:16px}
.modal{background:var(--surface);border-radius:10px;width:min(720px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:20px;display:grid;gap:16px}
.form-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.form-grid .wide{grid-column:1/-1}
.form-grid input{width:100%}
.ov-table td,.ov-table th{padding:5px 6px}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:8px;z-index:30;font-size:13px}
.frete td input{width:72px;padding:3px 5px;font-size:12px}
.frete td,.frete th{padding:4px 6px}
.state{padding:10px 12px;border-radius:6px;background:var(--sunk);color:var(--muted)}
@media (max-width:640px){nav.tabs{margin-left:0;width:100%}.detail{position:static}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script id="motor">
/* ===== Motor de precificação (puro) ===== */
const CANAIS=[
  {id:'ml_premium',nome:'ML Premium',tipo:'ml'},
  {id:'ml_classico',nome:'ML Clássico',tipo:'ml'},
  {id:'shopee',nome:'Shopee',tipo:'faixas'},
  {id:'tiktok',nome:'TikTok Shop',tipo:'faixas'}];
function pesoCobrado(p){const cub=(+p.L||0)*(+p.C||0)*(+p.P||0)/6000;return Math.max(+p.peso||0,cub);}
function idxPeso(frete,kg){let i=0;frete.linhas.forEach((l,k)=>{if(kg>=l.ini)i=k;});return i;}
function hojeISO(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function grupoML(cli,prod){const gs=cli.tarifasML||[];return gs.find(g=>g.id===prod.tarifaML)||gs[0]||null;}
function promoAtiva(prod,canal,hoje){const pr=(prod.promoML||{})[canal];if(!pr||!(+pr.reducao>0))return null;if(pr.ate&&pr.ate<hoje)return null;return pr;}
function cfgEfetiva(cli,canal,prod,opt={}){
  const c=cli.canais[canal]||{};const ov=(prod.overrides||{})[canal]||{};
  let com=ov.comissao;
  if(com==null&&canal.startsWith('ml_')){const g=grupoML(cli,prod);if(g)com=canal==='ml_premium'?+g.premium:+g.classico;}
  const pr=opt.semPromo?null:promoAtiva(prod,canal,opt.hoje||hojeISO());
  return {ads:ov.ads??c.ads??0,comissao:com,descFixo:+ov.desconto||0,promo:pr,desconto:(+ov.desconto||0)+(pr?+pr.reducao:0),c};
}
function bandas(cli,canal,prod,frete){
  const def=CANAIS.find(x=>x.id===canal);const e=cfgEfetiva(cli,canal,prod);
  if(def.tipo==='ml'){
    if(!frete)return [];
    const com=e.comissao??e.c.comissao??0;const pi=idxPeso(frete,pesoCobrado(prod));
    return frete.faixasPreco.map((fp,j)=>({ini:+fp.ini,nome:fp.nome,pct:com,fixo:+frete.linhas[pi].v[j],rot:'Frete ML'}));
  }
  const ff=+(e.c.freteFixo||0);
  return (e.c.faixas||[]).slice().sort((a,b)=>a.ini-b.ini).map(f=>({ini:+f.ini,nome:'',pct:e.comissao??+f.pct,fixo:(+f.fixo||0)+ff,rot:'Taxa fixa'+(ff?' + frete':'')}));
}
function bandaDe(bs,P){let b=bs[0];for(const x of bs)if(P>=x.ini)b=x;return b;}
function precoSugerido(cli,canal,prod,frete,m,opt={}){
  const bs=bandas(cli,canal,prod,frete);if(!bs.length)return null;
  const e=cfgEfetiva(cli,canal,prod,opt);
  const base=(+cli.imposto||0)+(+cli.despesas||0)+(+e.ads||0);
  const custo=(+prod.cmv||0)+(+prod.embalagem||0)-e.desconto;
  let best=null;
  bs.forEach((b,i)=>{
    const den=1-base-b.pct-m;if(den<=0)return;
    const p=(custo+b.fixo)/den;const c=Math.max(p,b.ini);
    const prox=i+1<bs.length?bs[i+1].ini:Infinity;
    if(c<prox&&(best===null||c<best))best=c;
  });
  return best;
}
function dre(cli,canal,prod,frete,P,opt={}){
  const bs=bandas(cli,canal,prod,frete);if(!bs.length||!(P>0))return null;
  const b=bandaDe(bs,P);const e=cfgEfetiva(cli,canal,prod,opt);
  const r={preco:P,imposto:P*(+cli.imposto||0),despesas:P*(+cli.despesas||0),comissao:P*b.pct-e.desconto,
    ads:P*(+e.ads||0),fixo:b.fixo,promo:e.promo,descFixo:e.descFixo,rotFixo:b.rot,faixa:b.nome,cmv:+prod.cmv||0,emb:+prod.embalagem||0,pctCom:b.pct,pctAds:+e.ads||0};
  r.lucro=P-(r.imposto+r.despesas+r.comissao+r.ads+r.fixo+r.cmv+r.emb);r.margem=r.lucro/P;return r;
}

<script>

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const pct=(v,d=1)=>v==null||!isFinite(v)?'—':(v*100).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d})+'%';

const parseN=s=>{if(s==null)return NaN;s=String(s).trim().replace(/R\$|\s|%/g,'');if(!s)return NaN;if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');return parseFloat(s);};
const dataBR=iso=>iso?iso.split('-').reverse().slice(0,2).join('/'):'';
const dataBRc=iso=>iso?iso.split('-').reverse().join('/'):'';
const PADRAO={imposto:0.10,despesas:0.057,margem:0.15,canais:{
  ml_premium:{ativo:true,comissao:0.165,ads:0.04},
  ml_classico:{ativo:true,comissao:0.115,ads:0.04},
  shopee:{ativo:false,ads:0.04,freteFixo:0,faixas:[{ini:0,pct:0.20,fixo:4.5},{ini:80,pct:0.14,fixo:16},{ini:100,pct:0.14,fixo:20},{ini:200,pct:0.14,fixo:26}]},
  tiktok:{ativo:false,ads:0,freteFixo:0,faixas:[{ini:0,pct:0.10,fixo:4}]}}};

const S={db:null,clientes:[],cid:null,produtos:[],frete:null,busca:'',sel:null,sim:'',view:'precos',
  loaded:{cli:false,prod:false,frete:false},erro:null,unsubProd:null,pendente:null,marcados:new Set(),fechados:new Set()};
function cli(){return S.clientes.find(c=>c.id===S.cid)||null;}
function canaisAtivos(c){return CANAIS.filter(k=>c.canais?.[k.id]?.ativo);}

function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;$('#toastRoot').replaceChildren(t);setTimeout(()=>t.remove(),2800);}

/* ---------- Anúncios: cada SKU tem um conjunto de anúncios (MLB, Shopee, TikTok) ---------- */
function anuncios(p){return Object.entries(p.anuncios||{}).filter(([,a])=>a).map(([id,a])=>({id,...a})).sort((x,y)=>(+x.ordem||0)-(+y.ordem||0));}
function vprod(p,a){const ov={};if(a.taxa!=null)ov.comissao=+a.taxa;if(a.ads!=null)ov.ads=+a.ads;if(+a.desc)ov.desconto=+a.desc;
  return {...p,overrides:{[a.canal]:ov},promoML:a.promo&&+a.promo.reducao>0?{[a.canal]:a.promo}:{}};}
function calc(c,p,a,m,opt){const vp=vprod(p,a);return {vp,sug:precoSugerido(c,a.canal,vp,S.frete,m,opt),d:+a.preco>0?dre(c,a.canal,vp,S.frete,+a.preco):null,e:cfgEfetiva(c,a.canal,vp)};}
function salvarAnuncio(pid,aid,patch){gravar(pPath(pid),()=>S.db.doc(pPath(pid)).update({anuncios:{[aid]:patch}}));}
function filtro(){const q=S.busca.trim().toLowerCase();

function viewPrecos(c){

  const body=lista.map(({p,as,total})=>{

      <label class="gf">CMV R$ <input class="n cell" id="pf_${pid}_cmv" data-pf="${pid}|cmv" inputmode="decimal" value="${n2(+p.cmv)}"></label>
      <label class="gf">Emb. R$ <input class="n cell" style="width:62px" id="pf_${pid}_emb" data-pf="${pid}|embalagem" inputmode="decimal" value="${n2(+p.embalagem)}"></label>
      <span class="gf muted">Peso cobrado <b class="num">${n2(pesoCobrado(p))} kg</b></span>
      <span class="gf muted">${total?`${as.length} de ${total} anúncios`:`${as.length} anúncio${as.length===1?'':'s'}`}</span>
      ${promoAtivas?`<span class="chip promo">${promoAtivas} em promoção</span>`:''}
      <button class="link" onclick="novoAnuncio('${pid}')">+ Anúncio</button><button class="link" onclick="editarProduto('${pid}')">Editar SKU</button>
    </div></td></tr>`;

  const tools=`<div class="toolbar"><div class="grp"><input id="inBusca" type="search" placeholder="Buscar SKU, nome, MLB ou família" value="${esc(S.busca)}" style="width:290px">
      <button class="link" onclick="S.fechados.clear();render()">Expandir todos</button><button class="link" onclick="S.produtos.forEach(p=>S.fechados.add(p.id));render()">Recolher todos</button></div>

  const nSel=S.marcados.size;

function linhaAnuncio(c,p,a,m,hoje,ativosIds){

    <td class="r"><input class="n cell${exp?' exp':''}" style="width:66px" id="${fid('reducao')}" ${da('reducao')} inputmode="decimal" value="${temP?n2(pr.reducao):''}" placeholder="—" title="${exp?'Promoção expirada':''}" aria-label="Redução da taxa em R$"></td>
    <td><input type="date" class="cell date${exp?' exp':''}" id="${fid('ate')}" ${da('ate')} value="${esc(pr.ate||'')}" aria-label="Promoção válida até"></td>

    <td class="r"><input class="n cell" id="${fid('preco')}" ${da('preco')} inputmode="decimal" value="${+a.preco>0?n2(a.preco):''}" placeholder="—" aria-label="Preço de venda"></td>

function viewDetalhe(c,p,a){
  const m=+c.margem||0;const k=a.canal;const {vp,sug}=calc(c,p,a,m);const simV=parseN(S.sim);

    ${pr?`<div class="promo-cmp"><span>Sugerido <b>com</b> promoção (−${brl(+pr.reducao)} até ${dataBRc(pr.ate)}) <b class="num">${brl(sug)}</b></span><span>Sugerido <b>sem</b> promoção <b class="num">${brl(sugSem)}</b></span></div>`:''}
    <div class="sim"><label class="label" for="inSim">Simular preço</label><input id="inSim" class="n" inputmode="decimal" placeholder="${n2(sug)}" value="${esc(S.sim)}">${S.sim?`<button class="link" onclick="S.sim='';render()">usar sugerido</button>`:''}</div>
    ${d?`<div class="dre">
      <div><span><b>Preço de venda</b>${isFinite(simV)&&simV>0?'':' <span class="tag">sugerido</span>'}</span><span><b>${brl(d.preco)}</b></span></div>

      ${linha('Taxa ('+pct(d.pctCom)+')'+(d.promo?' c/ redução −'+brl(+d.promo.reducao):'')+(d.descFixo?' c/ desconto −'+brl(d.descFixo):''),d.comissao)}
      ${linha('ADS ('+pct(d.pctAds)+')',d.ads)}${linha(esc(d.rotFixo)+(d.faixa?' · '+esc(d.faixa):''),d.fixo)}

    <p class="note">Peso cobrado ${n2(pesoCobrado(p))} kg (maior entre real ${n2(+p.peso)} kg e cúbico ${n2((+p.L||0)*(+p.C||0)*(+p.P||0)/6000)} kg).</p></aside>`;
}

    :`<div class="panel empty"><h2>Nenhum produto ainda</h2><p>Cole as linhas da sua planilha em “Importar do Excel” ou cadastre um por um.</p></div>`}`;

function inPct(id,v,attrs=''){return `<input class="n" id="${id}" inputmode="decimal" value="${pctIn(v)}" ${attrs}>`;}
function viewParametros(c){
  const fr=S.frete;
  const canalCard=k=>{const cfg=c.canais[k.id]||{};let body='';

    else{const fx=cfg.faixas||[];

    ${fr.linhas.map((l,i)=>`<tr><td>${esc(l.nome)}</td>${l.v.map((v,j)=>`<td><input class="n" id="fr_${i}_${j}" inputmode="decimal" value="${n2(v)}" data-fr="${i}.${j}" aria-label="Frete ${esc(l.nome)} ${esc(fr.faixasPreco[j].nome)}"></td>`).join('')}</tr>`).join('')}
    </tbody></table></div></section>`:`<div class="state">Carregando tabela de frete…</div>`;
  return `<div><h1>Parâmetros · ${esc(c.nome)}</h1><p class="sub">Taxas usadas no cálculo. Mudou aqui, todos os preços se atualizam.</p></div>
  <section class="panel card"><h2>Cliente</h2><div class="row2">
    <div class="field"><label class="label" for="pc_nome">Nome</label><input id="pc_nome" value="${esc(c.nome)}" data-cn="nome"></div>
    <div class="field"><label class="label" for="pc_imp">Impostos %</label>${inPct('pc_imp',c.imposto,'data-cn="imposto"')}</div>

    <div class="field"><label class="label" for="pc_marg">Margem padrão %</label>${inPct('pc_marg',c.margem,'data-cn="margem"')}</div></div></section>
  <div class="cards">${CANAIS.map(canalCard).join('')}</div>${freteT}

}

/* ---------- Eventos ---------- */
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='inBusca'){S.busca=t.value;debounce('busca',180,render);}
  else if(t.id==='inSim'){S.sim=t.value;debounce('sim',250,render);}
  else if(t.id==='inMargem'){const v=parseN(t.value);if(isFinite(v)&&v>=0&&v<100)debounce('margem',500,()=>upCliente({margem:v/100}));}
});
document.addEventListener('change',e=>{
  const t=e.target;const c=cli();if(!c)return;
  if(t.id==='cliSel'){S.cid=t.value;try{localStorage.setItem('prec_cli',S.cid)}catch{};S.sel=null;S.sim='';S.marcados.clear();S.fechados.clear();assinarProdutos();render();return;}
  if(t.dataset.ck){t.checked?S.marcados.add(t.dataset.ck):S.marcados.delete(t.dataset.ck);render();return;}
  if(t.dataset.gck){const it=filtro().find(x=>x.p.id===t.dataset.gck);if(it)it.as.forEach(a=>{const k=it.p.id+'|'+a.id;t.checked?S.marcados.add(k):S.marcados.delete(k);});render();return;}
  if(t.id==='ckAll'){const busca=!!S.busca.trim();filtro().forEach(({p,as})=>{if(!busca&&S.fechados.has(p.id))return;as.forEach(a=>{const k=p.id+'|'+a.id;t.checked?S.marcados.add(k):S.marcados.delete(k);});});render();return;}
  if(t.dataset.pf){const [pid,f]=t.dataset.pf.split('|');const p=S.produtos.find(x=>x.id===pid);if(!p)return;const txt=t.value.trim();const v=parseN(txt);
    if(txt&&!(isFinite(v)&&v>=0)){toast('Valor inválido. Use números, ex.: 51,52');render();return;}const nv=txt?v:0;if(nv===+p[f])return;p[f]=nv;render();
    gravar(pPath(pid),()=>S.db.doc(pPath(pid)).update({[f]:nv}));return;}
  if(t.dataset.af){const [pid,aid,f]=t.dataset.af.split('|');const p=S.produtos.find(x=>x.id===pid);const a=p?.anuncios?.[aid];if(!a)return;
    const txt=t.value.trim();let val;
    if(f==='mlb'){val=txt?txt.toUpperCase().replace(/\s/g,''):null;}
    else if(f==='familia'){val=txt||null;}
    else if(f==='canal'||f==='ate'){val=t.value||null;}
    else{const v=parseN(txt);if(txt&&!(isFinite(v)&&v>=0)){toast('Valor inválido.');render();return;}
      if(f==='taxa'||f==='ads'){if(txt&&v>=100){toast('Use percentual. Ex.: 16,5');render();return;}val=txt?v/100:null;}else val=txt?v:null;}
    let patch;
    if(f==='reducao'||f==='ate'){const pr={...(a.promo||{})};if(f==='reducao')pr.reducao=val||0;else pr.ate=val;a.promo=pr;patch={promo:pr};
      if(f==='reducao'&&val>0&&!pr.ate)toast('Informe a data final em “Válida até”.');}
    else{a[f]=val;patch={[f]:val};if(f==='canal'){a.taxa=null;a.ads=null;patch.taxa=null;patch.ads=null;}}
    render();salvarAnuncio(pid,aid,patch);return;}
  if(t.dataset.ativo){upCliente({canais:{[t.dataset.ativo]:{ativo:t.checked}}});return;}
  if(t.dataset.cn){const k=t.dataset.cn;if(k==='nome'){if(t.value.trim())upCliente({nome:t.value.trim()});return;}
    const v=parseN(t.value);if(isFinite(v))upCliente({[k]:v/100});else{toast('Valor inválido.');render();}return;}
  if(t.dataset.cp){const [k,f]=t.dataset.cp.split('.');const v=parseN(t.value);if(!isFinite(v)){toast('Valor inválido.');render();return;}
    upCliente({canais:{[k]:{[f]:t.dataset.tipo==='rs'?v:v/100}}});return;}
  if(t.dataset.fx){const [k,i,f]=t.dataset.fx.split('.');const v=parseN(t.value);if(!isFinite(v)){toast('Valor inválido.');render();return;}
    const fx=structuredClone(c.canais[k].faixas);fx[+i][f]=t.dataset.tipo==='rs'?v:v/100;fx.sort((a,b)=>a.ini-b.ini);upCliente({canais:{[k]:{faixas:fx}}});return;}
  if(t.dataset.fr||t.id==='frAtual'){const fr=structuredClone(S.frete);
    if(t.id==='frAtual')fr.atualizado=t.value.trim();else{const [i,j]=t.dataset.fr.split('.').map(Number);const v=parseN(t.value);if(!isFinite(v)){toast('Valor inválido.');render();return;}fr.linhas[i].v[j]=v;}
    S.frete=fr;render();gravar('config/freteML',()=>S.db.doc('config/freteML').set(fr));}
});
document.addEventListener('click',e=>{
  const tg=e.target.closest('[data-tog]');if(tg){const id=tg.dataset.tog;S.fechados.has(id)?S.fechados.delete(id):S.fechados.add(id);render();return;}
  const tr=e.target.closest('tr[data-row]');if(tr&&!e.target.closest('button,input,select,label')){S.sel=S.sel===tr.dataset.row?null:tr.dataset.row;S.sim='';render();return;}
  const te=e.target.closest('tr[data-edit]');if(te){editarProduto(te.dataset.edit);}
});
function addFaixa(k){const c=cli();const fx=structuredClone(c.canais[k].faixas||[]);const last=fx[fx.length-1]||{ini:0,pct:0.1,fixo:0};fx.push({ini:(+last.ini||0)+100,pct:last.pct,fixo:last.fixo});upCliente({canais:{[k]:{faixas:fx}}});}
function remFaixa(k,i){const c=cli();const fx=structuredClone(c.canais[k].faixas);fx.splice(i,1);upCliente({canais:{[k]:{faixas:fx}}});}

/* ---------- Anúncios: criar, remover, lote ---------- */
function novoAnuncio(pid){const c=cli();const p=S.produtos.find(x=>x.id===pid);if(!p)return;
  const canal=canaisAtivos(c).find(k=>k.tipo==='ml')?.id||canaisAtivos(c)[0]?.id||'ml_premium';
  const aid=novoId('a');const a={canal,mlb:null,familia:null,preco:null,ordem:Math.max(0,...anuncios(p).map(x=>+x.ordem||0))+1};
  p.anuncios={...(p.anuncios||{}),[aid]:a};S.fechados.delete(pid);render();salvarAnuncio(pid,aid,a);
  setTimeout(()=>document.getElementById(`f_${pid}_${aid}_mlb`)?.focus(),30);}
function removerAnuncio(pid,aid){const p=S.produtos.find(x=>x.id===pid);if(!p)return;S.pendente=null;
  const doc=structuredClone(p);delete doc.id;delete doc.anuncios[aid];delete p.anuncios[aid];S.marcados.delete(pid+'|'+aid);if(S.sel===pid+'|'+aid)S.sel=null;
  render();gravar(pPath(pid),()=>S.db.doc(pPath(pid)).set(doc).then(()=>toast('Anúncio removido.')));}
function aplicarLote(fn){const porP={};
  for(const key of S.marcados){const [pid,aid]=key.split('|');const p=S.produtos.find(x=>x.id===pid);const a=p?.anuncios?.[aid];if(!a)continue;
    const pt=fn(a);if(!pt)continue;Object.assign(a,structuredClone(pt));(porP[pid]=porP[pid]||{})[aid]=pt;}
  let n=0;for(const pid in porP){n+=Object.keys(porP[pid]).length;const up={anuncios:porP[pid]};gravar(pPath(pid),()=>S.db.doc(pPath(pid)).update(up));}
  render();return n;}
const plural=(n,s)=>`${n} ${s}${n===1?'':'s'}`;
function promoLote(){const fim=new Date();fim.setDate(fim.getDate()+14);const dflt=fim.toISOString().slice(0,10);const c=cli();const ativos=canaisAtivos(c);
  modal(`<h2>Aplicar promoção</h2><p class="note">Vale para os ${S.marcados.size} anúncios selecionados. Informe a redução da taxa em reais, como o marketplace mostra. Deixe em branco o canal que não entra.</p>
  <div class="form-grid">${ativos.map(k=>`<div class="field"><label class="label" for="pl_${k.id}">Redução ${esc(k.nome)} (R$)</label><input id="pl_${k.id}" class="num" inputmode="decimal" placeholder="ex.: 5,68"></div>`).join('')}
  <div class="field"><label class="label" for="plAte">Válida até</label><input id="plAte" type="date" value="${dflt}"></div></div>
  <p class="note">No dia seguinte à data final, o cálculo volta sozinho para a taxa normal.</p>
  <div class="sim"><button class="primary" id="plOk">Aplicar</button><button onclick="fecharModal()">Cancelar</button></div>`);
  $('#plOk').onclick=()=>{const ate=$('#plAte').value;const red={};ativos.forEach(k=>{const v=parseN($('#pl_'+k.id).value);if(v>0)red[k.id]=v;});
    if(!ate){toast('Informe a data final da promoção.');return;}if(!Object.keys(red).length){toast('Informe a redução de ao menos um canal.');return;}
    const n=aplicarLote(a=>red[a.canal]?{promo:{reducao:red[a.canal],ate}}:null);fecharModal();toast(`Promoção aplicada em ${plural(n,'anúncio')}.`);};}
function removerPromoLote(){const n=aplicarLote(a=>a.promo&&+a.promo.reducao>0?{promo:null}:null);toast(n?`Promoção removida de ${plural(n,'anúncio')}.`:'Nenhum dos selecionados tinha promoção.');}
function taxaLote(){const c=cli();const ativos=canaisAtivos(c);
  modal(`<h2>Alterar taxa / ADS</h2><p class="note">Vale para os ${S.marcados.size} anúncios selecionados, conforme o canal de cada um. Deixe em branco o que não muda.</p>
  <div class="form-grid">${ativos.map(k=>`<div class="field"><label class="label" for="tl_${k.id}">Taxa ${esc(k.nome)} %</label><input id="tl_${k.id}" class="num" inputmode="decimal" placeholder="${k.tipo==='ml'?pctIn(c.canais[k.id]?.comissao):'faixa'}"></div>`).join('')}
  <div class="field"><label class="label" for="tlAds">ADS % (todos)</label><input id="tlAds" class="num" inputmode="decimal" placeholder="ex.: 4"></div></div>
  <div class="sim"><button class="primary" id="tlOk">Aplicar</button><button onclick="fecharModal()">Cancelar</button></div>`);
  $('#tlOk').onclick=()=>{const ok=v=>isFinite(v)&&v>=0&&v<100;const tx={};ativos.forEach(k=>{const v=parseN($('#tl_'+k.id).value);if(ok(v))tx[k.id]=v/100;});const ads=parseN($('#tlAds').value);
    if(!Object.keys(tx).length&&!ok(ads)){toast('Informe ao menos um valor.');return;}
    const n=aplicarLote(a=>{const pt={};if(tx[a.canal]!=null)pt.taxa=tx[a.canal];if(ok(ads))pt.ads=ads/100;return Object.keys(pt).length?pt:null;});
    fecharModal();toast(`Alterado em ${plural(n,'anúncio')}.`);};}

/* ---------- Clientes ---------- */
function slug(s){return (s||'cliente').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)||'cliente';}
function novoCliente(){modal(`<h2>Novo cliente</h2><div class="field"><label class="label" for="ncNome">Nome do cliente</label><input id="ncNome" placeholder="Ex.: Loja Exemplo"></div>
  <p class="note">O cliente começa com as taxas padrão (impostos 10%, assessoria/operação 5,7%, ML Premium 16,5%, Clássico 11,5%, ADS 4%). Você ajusta em Parâmetros.</p>
  <div class="sim"><button class="primary" id="ncOk">Criar cliente</button><button onclick="fecharModal()">Cancelar</button></div>`);
  $('#ncNome').focus();
  $('#ncOk').onclick=async()=>{const nome=$('#ncNome').value.trim();if(!nome){toast('Informe o nome.');return;}
    let id=slug(nome);if(S.clientes.some(c=>c.id===id))id+='-'+Date.now().toString(36);
    try{await S.db.doc('clientes/'+id).set({nome,criadoEm:new Date().toISOString(),...structuredClone(PADRAO)});S.cid=id;try{localStorage.setItem('prec_cli',id)}catch{};fecharModal();S.view='parametros';location.hash='parametros';assinarProdutos();toast('Cliente criado.');}
    catch(err){toast(err?.code==='invalid_argument'?'Você não tem permissão para criar clientes.':'Não foi possível criar o cliente.');}};
}
$('#btnNovoCli').onclick=novoCliente;
async function excluirCliente(){const c=cli();if(!c)return;S.pendente=null;
  try{for(const p of S.produtos)await S.db.doc(`clientes/${c.id}/produtos/${p.id}`).delete();await S.db.doc('clientes/'+c.id).delete();
    S.cid=null;S.view='precos';location.hash='precos';toast('Cliente excluído.');}catch(e){toast('Não foi possível excluir.');}}

/* ---------- SKU: editar ---------- */
function modal(html){$('#modalRoot').innerHTML=`<div class="overlay" onclick="if(event.target===this)fecharModal()"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;}
function fecharModal(){$('#modalRoot').innerHTML='';}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modalRoot').innerHTML)fecharModal();});
function editarProduto(id){
  const p=id?S.produtos.find(x=>x.id===id):{sku:'',nome:'',L:0,C:0,P:0,peso:0,cmv:0,embalagem:0};if(!p)return;
  const f=(k,lab,v,num=true,cls='')=>`<div class="field ${cls}"><label class="label" for="ep_${k}">${lab}</label><input id="ep_${k}" ${num?'inputmode="decimal" class="num"':''} value="${esc(num?n2(v):v??'')}"></div>`;
  modal(`<h2>${id?'Editar SKU':'Novo SKU'}</h2>
  <div class="form-grid">${f('sku','SKU',p.sku,false)}${f('nome','Nome',p.nome,false,'wide')}
  ${f('L','Largura (cm)',p.L)}${f('C','Comprimento (cm)',p.C)}${f('P','Altura (cm)',p.P)}${f('peso','Peso real (kg)',p.peso)}
  ${f('cmv','CMV (R$)',p.cmv)}${f('embalagem','Embalagem (R$)',p.embalagem)}</div>
  ${id?`<p class="note">${plural(anuncios(p).length,'anúncio')} neste SKU. Os anúncios são editados na tabela de Precificação.</p>`:'<p class="note">Depois de criar, adicione os anúncios do SKU na aba Precificação, em “+ Anúncio”.</p>'}
  <div class="toolbar"><div class="grp"><button class="primary" id="epOk">Salvar</button><button onclick="fecharModal()">Cancelar</button></div>
  ${id?`<div id="epDel" class="sim"><button class="danger" id="epDelBtn">Excluir SKU</button></div>`:''}</div>`);
  if(id)$('#epDelBtn').onclick=()=>{$('#epDel').innerHTML=`<span>Excluir o SKU e ${plural(anuncios(p).length,'anúncio')}?</span> <button class="danger" id="epDelSim">Sim, excluir</button>`;$('#epDelSim').onclick=()=>excluirProduto(id);};
  $('#epOk').onclick=()=>{
    const g=k=>$('#ep_'+k).value;const num=k=>{const v=parseN(g(k));return isFinite(v)?v:0;};
    const sku=g('sku').trim();if(!sku){toast('Informe o SKU.');return;}
    if(S.produtos.some(x=>x.sku===sku&&x.id!==id)){toast('Já existe um SKU com esse código.');return;}
    const campos={sku,nome:g('nome').trim(),L:num('L'),C:num('C'),P:num('P'),peso:num('peso'),cmv:num('cmv'),embalagem:num('embalagem')};
    fecharModal();
    if(id){Object.assign(p,campos);render();gravar(pPath(id),()=>S.db.doc(pPath(id)).update(campos).then(()=>toast('SKU salvo.')));}
    else{const nid=novoId('s');const doc={...campos,anuncios:{},ordem:Math.max(0,...S.produtos.map(x=>+x.ordem||0))+1};
      gravar(pPath(nid),()=>S.db.doc(pPath(nid)).set(doc).then(()=>toast('SKU criado. Adicione os anúncios em Precificação.')));}
  };
}
function excluirProduto(id){fecharModal();for(const k of [...S.marcados])if(k.startsWith(id+'|'))S.marcados.delete(k);if(S.sel?.startsWith(id+'|'))S.sel=null;
  gravar(pPath(id),()=>S.db.doc(pPath(id)).delete().then(()=>toast('SKU excluído.')));}

  const ex={sku:'B1.100	Fio Bicolor para som - 100m	25	25	7	1,7	51,52	0,65',anu:'B1.100	MLB5483998348	Premium	8396304686571407	133,74	16,5'};
  let linhas=[];
  const prev=()=>{const tp=$('#imTipo').value;const min=tp==='sku'?8:3;linhas=$('#imTxt').value.split(/\r?\n/).map(l=>l.split('\t')).filter(c=>c.length>=min&&c[0].trim());
    $('#imPrev').textContent=linhas.length?`${linhas.length} linhas prontas. Primeira: ${linhas[0].slice(0,3).join(' · ')}`:'Nenhuma linha válida ainda. Confira se copiou as colunas do Excel.';$('#imOk').disabled=!linhas.length;};
  const tipo=()=>{const tp=$('#imTipo').value;$('#imCols').textContent=cols[tp];$('#imTxt').placeholder=ex[tp];prev();};
  $('#imTipo').onchange=tipo;$('#imTxt').addEventListener('input',prev);tipo();
  $('#imOk').onclick=async()=>{
    const N=v=>{const x=parseN(v);return isFinite(x)?x:0;};const tp=$('#imTipo').value;$('#imOk').disabled=true;
    const bySku=Object.fromEntries(S.produtos.map(p=>[p.sku,p]));let ordem=Math.max(0,...S.produtos.map(p=>+p.ordem||0));let ok=0,falta=[],ruim=0;
    try{
      if(tp==='sku'){for(const c of linhas){const sku=c[0].trim();const ex=bySku[sku];
        const campos={sku,nome:(c[1]||'').trim(),L:N(c[2]),C:N(c[3]),P:N(c[4]),peso:N(c[5]),cmv:N(c[6]),embalagem:N(c[7])};
        if(ex)await S.db.doc(pPath(ex.id)).update(campos);else{const nid=novoId('s');await S.db.doc(pPath(nid)).set({...campos,anuncios:{},ordem:++ordem});}
        ok++;$('#imPrev').textContent=`Importando… ${ok}/${linhas.length}`;}}
      else{const porP={};
        for(const c of linhas){const sku=c[0].trim();const p=bySku[sku];if(!p){falta.push(sku);continue;}
          const canal=TIPOS[(c[2]||'').trim().toLowerCase()];if(!canal){ruim++;continue;}
          const mlb=(c[1]||'').trim().toUpperCase().replace(/\s/g,'')||null;const pt={canal,mlb};
          if(c[3]&&c[3].trim())pt.familia=c[3].trim();const pv=N(c[4]);if(pv>0)pt.preco=pv;const tx=parseN(c[5]);if(isFinite(tx)&&tx<100)pt.taxa=tx/100;
          const acc=porP[p.id]=porP[p.id]||{};const atual=[...anuncios(p),...Object.entries(acc).map(([id,a])=>({id,...a}))];
          const ex=atual.find(a=>a.canal===canal&&mlb&&a.mlb===mlb);
          if(ex)acc[ex.id]={...(acc[ex.id]||{}),...pt};else acc[novoId('a')]={...pt,ordem:Math.max(0,...atual.map(a=>+a.ordem||0))+1};ok++;}
        for(const pid in porP)await S.db.doc(pPath(pid)).update({anuncios:porP[pid]});}
    }catch(e){toast(e?.code==='quota_exceeded'?'Limite de armazenamento atingido.':'A importação parou no meio. Confira e tente de novo.');}
    fecharModal();toast(`${ok} ${tp==='sku'?'SKUs':'anúncios'} importados.`+(falta.length?` ${falta.length} sem SKU cadastrado (${[...new Set(falta)].slice(0,3).join(', ')}).`:'')+(ruim?` ${ruim} com tipo não reconhecido.`:''));};
}

/* ---------- Exportar ---------- */
async function exportar(){
  const c=cli();const m=+c.margem||0;const linhas=[];
  filtro().forEach(({p,as})=>as.forEach(a=>{const {sug,d,e}=calc(c,p,a,m);const pr=a.promo||{};
    linhas.push({SKU:p.sku,Produto:p.nome,'Anúncio':a.mlb||'',Família:a.familia||'',Canal:nomeCanal(a.canal),CMV:+p.cmv,Embalagem:+p.embalagem,'Peso cobrado (kg)':+pesoCobrado(p).toFixed(3),
      'Taxa %':e.comissao??'','Redução R$':+pr.reducao>0?+pr.reducao:'','Válida até':pr.ate?dataBRc(pr.ate):'','ADS %':e.ads,
      'Preço sugerido':sug==null?'':+sug.toFixed(2),'Preço de venda':+a.preco>0?+a.preco:'','Margem atual':d?+d.margem.toFixed(4):''});}));
  const nome=`Precificação ${c.nome} - margem ${pctIn(m)}%`;let data,fn;
  if(window.XLSX){const ws=XLSX.utils.json_to_sheet(linhas);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Preços');data=XLSX.write(wb,{bookType:'xlsx',type:'array'});fn=nome+'.xlsx';}
  else{const cols=Object.keys(linhas[0]||{});data=[cols.join(';'),...linhas.map(r=>cols.map(k=>String(r[k]).replace(/;/g,',')).join(';'))].join('\n');fn=nome+'.csv';}
  const dl=await claude.use('downloads');if(!dl){toast('Download indisponível nesta visualização.');return;}
  try{await dl.save({filename:fn,data});}catch(e){if(e?.code!=='declined')toast('Não foi possível gerar o arquivo.');}
}

/* ---------- Rotas e dados ---------- */
function rota(){const h=location.hash.slice(1);S.view=['precos','produtos','parametros'].includes(h)?h:'precos';render();}
addEventListener('hashchange',rota);
function assinarProdutos(){
  if(S.unsubProd)S.unsubProd();S.produtos=[];S.loaded.prod=false;if(!S.cid||!S.db)return;
  S.unsubProd=S.db.collection(`clientes/${S.cid}/produtos`).onSnapshot(snap=>{
    S.produtos=snap.docs.map(d=>({id:d.id,...structuredClone(d.data())})).filter(p=>p.anuncios!==undefined).sort((a,b)=>(+a.ordem||0)-(+b.ordem||0)||String(a.sku).localeCompare(String(b.sku)));
    S.loaded.prod=true;render();},()=>{S.erro='Não foi possível carregar os produtos. Recarregue a página.';render();});
}
(async()=>{
  try{S.cid=localStorage.getItem('prec_cli');}catch{}
  rota();
  const timer=setTimeout(()=>{if(!S.loaded.cli){S.erro='Os dados ainda não responderam. Verifique sua conexão; a página continua tentando.';render();}},10000);
  const db=await claude.use('db');
  if(!db){clearTimeout(timer);S.erro='Entre na sua conta do Claude para usar o Precificador.';render();return;}
  S.db=db;
  db.doc('config/freteML').onSnapshot(d=>{S.frete=d.exists?structuredClone(d.data()):null;S.loaded.frete=true;render();},()=>{});
  db.collection('clientes').onSnapshot(snap=>{
    clearTimeout(timer);if(S.erro&&!S.loaded.cli)S.erro=null;
    S.clientes=snap.docs.map(d=>({id:d.id,...structuredClone(d.data())})).sort((a,b)=>String(a.nome).localeCompare(String(b.nome)));
    const first=!S.loaded.cli;S.loaded.cli=true;
    if(!S.clientes.find(c=>c.id===S.cid)){S.cid=S.clientes[0]?.id||null;assinarProdutos();}
    else if(first)assinarProdutos();
    render();
  },()=>{clearTimeout(timer);S.erro='Não foi possível carregar os clientes.';render();});
})();
</script>
