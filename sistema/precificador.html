<style>
/* Layout: barra fixa com cliente + abas; área de trabalho larga com tabela rolável e painel de detalhe */
:root{
  --bg:#F3F4F1; --surface:#FFFFFF; --sunk:#E9EBE6; --ink:#1B2420; --muted:#5D6862; --line:#D6DAD3;
  --accent:#1E6B52; --accent-ink:#FFFFFF; --accent-soft:#DCEDE5;
  --ok:#1E7A4C; --ok-soft:#DDF1E5; --warn:#9A6200; --warn-soft:#FBEBCB; --bad:#B23A2E; --bad-soft:#F7DEDA;
  --f-display:"Sora","IBM Plex Sans",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121715; --surface:#1A201D; --sunk:#232A26; --ink:#E6EBE7; --muted:#9AA59F; --line:#323A35;
  --accent:#5CC49A; --accent-ink:#0E1A14; --accent-soft:#1F3A2E;
  --ok:#6BD39A; --ok-soft:#1D3527; --warn:#E9B65A; --warn-soft:#3A2E17; --bad:#F08A7E; --bad-soft:#3D2220; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121715; --surface:#1A201D; --sunk:#232A26; --ink:#E6EBE7; --muted:#9AA59F; --line:#323A35;
  --accent:#5CC49A; --accent-ink:#0E1A14; --accent-soft:#1F3A2E;
  --ok:#6BD39A; --ok-soft:#1D3527; --warn:#E9B65A; --warn-soft:#3A2E17; --bad:#F08A7E; --bad-soft:#3D2220; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-row{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:12px}
.brand{font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brand-mark{width:22px;height:22px;border-radius:5px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:12px}
.cli{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
nav.tabs{display:flex;gap:4px;margin-left:auto}
nav.tabs a{padding:7px 12px;border-radius:6px;color:var(--muted);text-decoration:none;font-weight:500}
nav.tabs a[aria-current="page"]{background:var(--accent-soft);color:var(--ink)}
nav.tabs a:hover{color:var(--ink)}
main{padding-block:20px 48px;display:grid;gap:18px}
h1{font-family:var(--f-display);font-size:22px;margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-family:var(--f-display);font-size:16px;margin:0}
.sub{color:var(--muted);margin:2px 0 0}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
button,.btn{font:inherit;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--muted)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.danger{color:var(--bad);border-color:var(--bad)}
button.link{border:0;background:none;padding:2px 4px;color:var(--accent);text-decoration:underline}
button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0}
input.n{font-family:var(--f-num);text-align:right;width:90px}
textarea{width:100%;font-family:var(--f-num);font-size:12px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:end;justify-content:space-between}
.toolbar .grp{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.field{display:grid;gap:4px}
.margem-box{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.margem-box input{font-family:var(--f-num);font-size:20px;width:84px;text-align:right;border-color:var(--accent);font-weight:500}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;vertical-align:middle}
thead th{position:sticky;top:0;background:var(--sunk);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
th.grp{text-align:center;border-left:1px solid var(--line);color:var(--ink)}
td.r,th.r{text-align:right}
td.bl,th.bl{border-left:1px solid var(--line)}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--sunk)}
tbody tr.sel td{background:var(--accent-soft)}
td.nome{max-width:280px;overflow:hidden;text-overflow:ellipsis}
.sku{font-family:var(--f-num);font-weight:500}
.sug{font-weight:600}
.chip{display:inline-block;padding:1px 7px;border-radius:999px;font-family:var(--f-num);font-size:12px;font-weight:500}
.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.bad{background:var(--bad-soft);color:var(--bad)}
.muted{color:var(--muted)}
.tag{font-size:11px;padding:1px 6px;border-radius:4px;background:var(--sunk);color:var(--muted);margin-left:6px}
.summary{display:flex;flex-wrap:wrap;gap:8px 18px;color:var(--muted);font-size:13px}
.summary b{color:var(--ink);font-family:var(--f-num);font-weight:500}
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
@media (min-width:1180px){.layout.has-detail{grid-template-columns:minmax(0,1fr) 380px}}
.detail{padding:16px;display:grid;gap:14px;align-self:start;position:sticky;top:76px}
.detail-head{display:flex;justify-content:space-between;gap:10px;align-items:start}
.canal-tabs{display:flex;flex-wrap:wrap;gap:4px}
.canal-tabs button{padding:5px 9px;font-size:13px}
.canal-tabs button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.dre{display:grid;gap:0}
.dre div{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed var(--line)}
.dre div.tot{border-bottom:0;border-top:1px solid var(--ink);font-weight:600;margin-top:2px}
.dre span:last-child{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.sim{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cards{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.card{padding:16px;display:grid;gap:12px;align-content:start}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.row2{display:flex;flex-wrap:wrap;gap:12px}
.note{font-size:12.5px;color:var(--muted);margin:0}
.warnbox{background:var(--warn-soft);color:var(--ink);border-radius:6px;padding:8px 10px;font-size:13px}
.empty{padding:40px 20px;text-align:center;color:var(--muted);display:grid;gap:10px;justify-items:center}
.overlay{position:fixed;inset:0;background:rgba(10,15,12,.45);display:grid;place-items:center;z-index:20;padding:16px}
.modal{background:var(--surface);border-radius:10px;width:min(720px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:20px;display:grid;gap:16px}
.form-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.form-grid .wide{grid-column:1/-1}
.form-grid input{width:100%}
.ov-table td,.ov-table th{padding:5px 6px}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:8px;z-index:30;font-size:13px}
.frete td input{width:72px;padding:3px 5px;font-size:12px}
.frete td,.frete th{padding:4px 6px}
.state{padding:10px 12px;border-radius:6px;background:var(--sunk);color:var(--muted)}
@media (max-width:640px){nav.tabs{margin-left:0;width:100%}.detail{position:static}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

  <div class="wrap top-row">

<script id="motor">
/* ===== Motor de precificação (puro) ===== */
const CANAIS=[
  {id:'ml_premium',nome:'ML Premium',tipo:'ml'},
  {id:'ml_classico',nome:'ML Clássico',tipo:'ml'},
  {id:'shopee',nome:'Shopee',tipo:'faixas'},
  {id:'tiktok',nome:'TikTok Shop',tipo:'faixas'}];
function pesoCobrado(p){const cub=(+p.L||0)*(+p.C||0)*(+p.P||0)/6000;return Math.max(+p.peso||0,cub);}
function idxPeso(frete,kg){let i=0;frete.linhas.forEach((l,k)=>{if(kg>=l.ini)i=k;});return i;}
function cfgEfetiva(cli,canal,prod){
  const c=cli.canais[canal]||{};const ov=(prod.overrides||{})[canal]||{};
  return {ads:ov.ads??c.ads??0,comissao:ov.comissao,desconto:+ov.desconto||0,c};
}
function bandas(cli,canal,prod,frete){
  const def=CANAIS.find(x=>x.id===canal);const e=cfgEfetiva(cli,canal,prod);
  if(def.tipo==='ml'){
    if(!frete)return [];
    const com=e.comissao??e.c.comissao??0;const pi=idxPeso(frete,pesoCobrado(prod));
    return frete.faixasPreco.map((fp,j)=>({ini:+fp.ini,nome:fp.nome,pct:com,fixo:+frete.linhas[pi].v[j],rot:'Frete ML'}));
  }
  const ff=+(e.c.freteFixo||0);
  return (e.c.faixas||[]).slice().sort((a,b)=>a.ini-b.ini).map(f=>({ini:+f.ini,nome:'',pct:e.comissao??+f.pct,fixo:(+f.fixo||0)+ff,rot:'Taxa fixa'+(ff?' + frete':'')}));
}
function bandaDe(bs,P){let b=bs[0];for(const x of bs)if(P>=x.ini)b=x;return b;}
function precoSugerido(cli,canal,prod,frete,m){
  const bs=bandas(cli,canal,prod,frete);if(!bs.length)return null;
  const e=cfgEfetiva(cli,canal,prod);
  const base=(+cli.imposto||0)+(+cli.despesas||0)+(+e.ads||0);
  const custo=(+prod.cmv||0)+(+prod.embalagem||0)-e.desconto;
  let best=null;
  bs.forEach((b,i)=>{
    const den=1-base-b.pct-m;if(den<=0)return;
    const p=(custo+b.fixo)/den;const c=Math.max(p,b.ini);
    const prox=i+1<bs.length?bs[i+1].ini:Infinity;
    if(c<prox&&(best===null||c<best))best=c;
  });
  return best;
}
function dre(cli,canal,prod,frete,P){
  const bs=bandas(cli,canal,prod,frete);if(!bs.length||!(P>0))return null;
  const b=bandaDe(bs,P);const e=cfgEfetiva(cli,canal,prod);
  const r={preco:P,imposto:P*(+cli.imposto||0),despesas:P*(+cli.despesas||0),comissao:P*b.pct-e.desconto,
    ads:P*(+e.ads||0),fixo:b.fixo,rotFixo:b.rot,faixa:b.nome,cmv:+prod.cmv||0,emb:+prod.embalagem||0,pctCom:b.pct,pctAds:+e.ads||0};
  r.lucro=P-(r.imposto+r.despesas+r.comissao+r.ads+r.fixo+r.cmv+r.emb);r.margem=r.lucro/P;return r;
}
</script>
<script>
/* ===== App ===== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=v=>v==null||!isFinite(v)?'—':v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const n2=v=>v==null||!isFinite(v)?'':(+v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const pct=(v,d=1)=>v==null||!isFinite(v)?'—':(v*100).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d})+'%';
const pctIn=v=>v==null?'':(+(v*100).toFixed(4)).toLocaleString('pt-BR',{maximumFractionDigits:4});
const parseN=s=>{if(s==null)return NaN;s=String(s).trim().replace(/R\$|\s|%/g,'');if(!s)return NaN;if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');return parseFloat(s);};
const PADRAO={imposto:0.10,despesas:0.057,margem:0.15,canais:{
  ml_premium:{ativo:true,comissao:0.165,ads:0.04},
  ml_classico:{ativo:true,comissao:0.115,ads:0.04},
  shopee:{ativo:false,ads:0.04,freteFixo:0,faixas:[{ini:0,pct:0.20,fixo:4.5},{ini:80,pct:0.14,fixo:16},{ini:100,pct:0.14,fixo:20},{ini:200,pct:0.14,fixo:26}]},
  tiktok:{ativo:false,ads:0,freteFixo:0,faixas:[{ini:0,pct:0.10,fixo:4}]}}};

const S={db:null,clientes:[],cid:null,produtos:[],frete:null,busca:'',sel:null,canalDet:'ml_premium',sim:'',view:'precos',
  loaded:{cli:false,prod:false,frete:false},erro:null,unsubProd:null,pendente:null,editavel:true};
function cli(){return S.clientes.find(c=>c.id===S.cid)||null;}
function canaisAtivos(c){return CANAIS.filter(k=>c.canais?.[k.id]?.ativo);}

function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;$('#toastRoot').replaceChildren(t);setTimeout(()=>t.remove(),2600);}
const filas={};
function gravar(path,fn){const p=(filas[path]||Promise.resolve()).then(fn).catch(e=>{console.error(e);
  if(e?.code==='invalid_argument'){S.editavel=false;toast('Você não tem permissão para alterar estes dados.');}
  else if(e?.code==='quota_exceeded')toast('Limite de armazenamento atingido. Exclua produtos antigos.');
  else toast('Não foi possível salvar. Tente de novo.');});filas[path]=p;return p;}
function upCliente(patch){const c=cli();if(!c||!S.db)return;Object.assign(c,structuredClone(patch));render();
  return gravar('clientes/'+c.id,()=>S.db.doc('clientes/'+c.id).update(patch));}
const deb={};function debounce(k,ms,fn){clearTimeout(deb[k]);deb[k]=setTimeout(fn,ms);}

/* ---------- Views ---------- */
function render(){
  document.querySelectorAll('nav.tabs a').forEach(a=>{if(a.dataset.v===S.view)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});
  const sel=$('#cliSel');
  sel.innerHTML=S.clientes.map(c=>`<option value="${esc(c.id)}"${c.id===S.cid?' selected':''}>${esc(c.nome)}</option>`).join('')||'<option>—</option>';
  const app=$('#app');
  if(S.erro){app.innerHTML=`<div class="state">${esc(S.erro)}</div>`;return;}
  if(!S.loaded.cli){app.innerHTML=`<div class="state">Carregando clientes…</div>`;return;}
  if(!S.clientes.length){app.innerHTML=`<div class="panel empty"><h2>Nenhum cliente cadastrado</h2><p>Crie o primeiro cliente para cadastrar produtos e taxas.</p><button class="primary" onclick="novoCliente()">Criar cliente</button></div>`;return;}
  const c=cli();if(!c){S.cid=S.clientes[0].id;return render();}
  const ae=document.activeElement;const keep=ae?.tagName==='INPUT'?ae.id:null;const pos=ae?.selectionStart;const raw=ae?.value;
  if(S.view==='precos')app.innerHTML=viewPrecos(c);
  else if(S.view==='produtos')app.innerHTML=viewProdutos(c);
  else app.innerHTML=viewParametros(c);
  if(keep){const el=document.getElementById(keep);if(el&&el.tagName==='INPUT'){if(el.type!=='checkbox')el.value=raw;el.focus();try{if(pos!=null)el.setSelectionRange(pos,pos);}catch{}}}
}
function filtrados(){const q=S.busca.trim().toLowerCase();return S.produtos.filter(p=>!q||(p.sku||'').toLowerCase().includes(q)||(p.nome||'').toLowerCase().includes(q)||(p.anuncioPremium||'').toLowerCase().includes(q)||(p.anuncioClassico||'').toLowerCase().includes(q));}
function chipMargem(m,meta){if(m==null||!isFinite(m))return '<span class="muted">—</span>';const cls=m<0?'bad':m<meta-0.0005?'warn':'ok';return `<span class="chip ${cls}">${pct(m)}</span>`;}

function viewPrecos(c){
  const ativos=canaisAtivos(c);const m=+c.margem||0;
  if(!S.loaded.prod)return `<div class="state">Carregando produtos…</div>`;
  const head=`<div class="toolbar"><div><h1>Precificação · ${esc(c.nome)}</h1><p class="sub">Preço de venda calculado para atingir a margem líquida desejada em cada canal.</p></div>
    <div class="grp"><div class="margem-box"><label class="label" for="inMargem">Margem líquida<br>desejada</label><input id="inMargem" inputmode="decimal" value="${pctIn(m)}" aria-describedby="hm"><span class="num" id="hm">%</span></div></div></div>`;
  if(!S.produtos.length)return head+`<div class="panel empty"><h2>Nenhum produto ainda</h2><p>Cadastre produtos ou importe da sua planilha na aba Produtos.</p><a class="btn" href="#produtos">Ir para Produtos</a></div>`;
  if(!S.frete&&ativos.some(a=>a.id.startsWith('ml')))return head+`<div class="state">Carregando tabela de frete do Mercado Livre…</div>`;
  const lista=filtrados();
  let abaixo=0,inv=0;
  const rows=lista.map(p=>{
    const cells=ativos.map(k=>{
      const sug=precoSugerido(c,k.id,p,S.frete,m);if(sug==null)inv++;
      const at=p.precoAtual?.[k.id];const d=at?dre(c,k.id,p,S.frete,at):null;
      if(d&&d.margem<m-0.0005)abaixo++;
      const ov=(p.overrides||{})[k.id];
      return `<td class="r bl num sug">${sug==null?'<span class="chip bad">inviável</span>':brl(sug)}${ov&&Object.keys(ov).length?'<span class="tag" title="Taxa específica deste produto">*</span>':''}</td>
        <td class="r num muted">${at?brl(at):'—'}</td><td class="r">${d?chipMargem(d.margem,m):'<span class="muted">—</span>'}</td>`;}).join('');
    return `<tr data-id="${esc(p.id)}" class="${S.sel===p.id?'sel':''}"><td class="sku">${esc(p.sku)}</td><td class="nome" title="${esc(p.nome)}">${esc(p.nome)}</td>
      <td class="r num">${n2(pesoCobrado(p))} kg</td><td class="r num">${brl(+p.cmv)}</td>${cells}</tr>`;}).join('');
  const sum=`<div class="summary"><span><b>${lista.length}</b> de ${S.produtos.length} anúncios</span><span><b>${abaixo}</b> preços atuais abaixo da meta</span>${inv?`<span><b>${inv}</b> sem preço possível (margem alta demais)</span>`:''}<span>* taxa específica do produto</span></div>`;
  const table=`<div class="panel scroll"><table><thead><tr><th colspan="4"></th>${ativos.map(k=>`<th class="grp" colspan="3">${esc(k.nome)}</th>`).join('')}</tr>
    <tr><th>SKU</th><th>Produto</th><th class="r">Peso cobrado</th><th class="r">CMV</th>${ativos.map(()=>`<th class="r bl">Sugerido</th><th class="r">Atual</th><th class="r">Margem atual</th>`).join('')}</tr></thead>
    <tbody>${rows||`<tr><td colspan="${4+ativos.length*3}" class="muted">Nenhum produto encontrado para “${esc(S.busca)}”.</td></tr>`}</tbody></table></div>`;
  const tools=`<div class="toolbar"><div class="grp"><input id="inBusca" type="search" placeholder="Buscar SKU, nome ou anúncio" value="${esc(S.busca)}" style="width:260px"></div>
    <div class="grp"><button type="button" onclick="exportar()">Exportar Excel</button></div></div>`;
  const p=S.produtos.find(x=>x.id===S.sel);
  return head+tools+sum+`<div class="layout ${p?'has-detail':''}"><div style="min-width:0">${table}</div>${p?viewDetalhe(c,p):''}</div>`;
}
function viewDetalhe(c,p){

/* ---------- Eventos ---------- */
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='inBusca'){S.busca=t.value;debounce('busca',150,render);}
  else if(t.id==='inSim'){S.sim=t.value;debounce('sim',250,render);}
  else if(t.id==='inMargem'){const v=parseN(t.value);if(isFinite(v)&&v>=0&&v<100){debounce('margem',500,()=>upCliente({margem:v/100}));}}
});
document.addEventListener('change',e=>{
  const t=e.target;const c=cli();if(!c)return;
  if(t.id==='cliSel'){S.cid=t.value;try{localStorage.setItem('prec_cli',S.cid)}catch{};S.sel=null;S.sim='';assinarProdutos();render();return;}
  if(t.dataset.ativo){upCliente({canais:{[t.dataset.ativo]:{ativo:t.checked}}});return;}
  if(t.dataset.cn){const k=t.dataset.cn;if(k==='nome'){if(t.value.trim())upCliente({nome:t.value.trim()});return;}
    const v=parseN(t.value);if(isFinite(v))upCliente({[k]:v/100});else{toast('Valor inválido.');render();}return;}
  if(t.dataset.cp){const [k,f]=t.dataset.cp.split('.');const v=parseN(t.value);if(!isFinite(v)){toast('Valor inválido.');render();return;}
    upCliente({canais:{[k]:{[f]:t.dataset.tipo==='rs'?v:v/100}}});return;}
  if(t.dataset.fx){const [k,i,f]=t.dataset.fx.split('.');const v=parseN(t.value);if(!isFinite(v)){toast('Valor inválido.');render();return;}
    const fx=structuredClone(c.canais[k].faixas);fx[+i][f]=t.dataset.tipo==='rs'?v:v/100;fx.sort((a,b)=>a.ini-b.ini);upCliente({canais:{[k]:{faixas:fx}}});return;}
  if(t.dataset.fr||t.id==='frAtual'){const fr=structuredClone(S.frete);
    if(t.id==='frAtual')fr.atualizado=t.value.trim();else{const [i,j]=t.dataset.fr.split('.').map(Number);const v=parseN(t.value);if(!isFinite(v)){toast('Valor inválido.');render();return;}fr.linhas[i].v[j]=v;}
    S.frete=fr;render();gravar('config/freteML',()=>S.db.doc('config/freteML').set(fr));}
});
document.addEventListener('click',e=>{
  const tr=e.target.closest('tr[data-id]');if(tr&&!e.target.closest('button')){S.sel=S.sel===tr.dataset.id?null:tr.dataset.id;S.sim='';render();return;}
  const te=e.target.closest('tr[data-edit]');if(te){editarProduto(te.dataset.edit);}
});
function addFaixa(k){const c=cli();const fx=structuredClone(c.canais[k].faixas||[]);const last=fx[fx.length-1]||{ini:0,pct:0.1,fixo:0};fx.push({ini:(+last.ini||0)+100,pct:last.pct,fixo:last.fixo});upCliente({canais:{[k]:{faixas:fx}}});}
function remFaixa(k,i){const c=cli();const fx=structuredClone(c.canais[k].faixas);fx.splice(i,1);upCliente({canais:{[k]:{faixas:fx}}});}

/* ---------- Clientes ---------- */
function slug(s){return (s||'cliente').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)||'cliente';}
function novoCliente(){modal(`<h2>Novo cliente</h2><div class="field"><label class="label" for="ncNome">Nome do cliente</label><input id="ncNome" placeholder="Ex.: Loja Exemplo"></div>
  <p class="note">O cliente começa com as taxas padrão (impostos 10%, assessoria/operação 5,7%, ML Premium 16,5%, Clássico 11,5%, ADS 4%). Você ajusta em Parâmetros.</p>
  <div class="sim"><button class="primary" id="ncOk">Criar cliente</button><button onclick="fecharModal()">Cancelar</button></div>`);
  $('#ncNome').focus();
  $('#ncOk').onclick=async()=>{const nome=$('#ncNome').value.trim();if(!nome){toast('Informe o nome.');return;}
    let id=slug(nome);if(S.clientes.some(c=>c.id===id))id+='-'+Date.now().toString(36);
    const doc={nome,criadoEm:new Date().toISOString(),...structuredClone(PADRAO)};
    try{await S.db.doc('clientes/'+id).set(doc);S.cid=id;try{localStorage.setItem('prec_cli',id)}catch{};fecharModal();S.view='parametros';location.hash='parametros';assinarProdutos();toast('Cliente criado.');}
    catch(err){toast(err?.code==='invalid_argument'?'Você não tem permissão para criar clientes.':'Não foi possível criar o cliente.');}};
}
$('#btnNovoCli').onclick=novoCliente;
async function excluirCliente(){const c=cli();if(!c)return;S.pendente=null;
  try{for(const p of S.produtos)await S.db.doc(`clientes/${c.id}/produtos/${p.id}`).delete();await S.db.doc('clientes/'+c.id).delete();
    S.cid=null;S.view='precos';location.hash='precos';toast('Cliente excluído.');}catch(e){toast('Não foi possível excluir.');}}

/* ---------- Produtos: editar ---------- */
function modal(html){$('#modalRoot').innerHTML=`<div class="overlay" onclick="if(event.target===this)fecharModal()"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;}
function fecharModal(){$('#modalRoot').innerHTML='';}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modalRoot').innerHTML)fecharModal();});
function editarProduto(id){
  const c=cli();const p=id?S.produtos.find(x=>x.id===id):{sku:'',nome:'',L:0,C:0,P:0,peso:0,cmv:0,embalagem:0,overrides:{},precoAtual:{}};
  if(!p)return;const ov=p.overrides||{};
  const f=(k,lab,v,num=true,cls='')=>`<div class="field ${cls}"><label class="label" for="ep_${k}">${lab}</label><input id="ep_${k}" ${num?'inputmode="decimal" class="num"':''} value="${esc(num?n2(v):v??'')}"></div>`;
  modal(`<h2>${id?'Editar produto':'Novo produto'}</h2>
  <div class="form-grid">${f('sku','SKU',p.sku,false)}${f('nome','Nome',p.nome,false,'wide')}
  ${f('anuncioPremium','Anúncio Premium',p.anuncioPremium,false)}${f('anuncioClassico','Anúncio Clássico',p.anuncioClassico,false)}
  ${f('L','Largura (cm)',p.L)}${f('C','Comprimento (cm)',p.C)}${f('P','Altura (cm)',p.P)}${f('peso','Peso real (kg)',p.peso)}
  ${f('cmv','CMV (R$)',p.cmv)}${f('embalagem','Embalagem (R$)',p.embalagem)}</div>
  <div><div class="label" style="margin-bottom:6px">Por canal</div><div class="scroll"><table class="ov-table"><thead><tr><th>Canal</th><th>Preço atual (R$)</th><th>Comissão % <span class="muted">(vazio = padrão)</span></th><th>ADS %</th><th>Desconto tarifa (R$)</th></tr></thead><tbody>
  ${CANAIS.map(k=>{const o=ov[k.id]||{};return `<tr><td>${esc(k.nome)}</td><td><input class="n" id="ep_pa_${k.id}" inputmode="decimal" value="${n2(p.precoAtual?.[k.id])}"></td>
    <td><input class="n" id="ep_co_${k.id}" inputmode="decimal" value="${o.comissao!=null?pctIn(o.comissao):''}" placeholder="${k.tipo==='ml'?pctIn(c.canais[k.id]?.comissao):'faixas'}"></td>
    <td><input class="n" id="ep_ad_${k.id}" inputmode="decimal" value="${o.ads!=null?pctIn(o.ads):''}" placeholder="${pctIn(c.canais[k.id]?.ads)}"></td>
    <td><input class="n" id="ep_de_${k.id}" inputmode="decimal" value="${o.desconto?n2(o.desconto):''}" placeholder="0,00"></td></tr>`;}).join('')}</tbody></table></div>
  <p class="note">Use ADS 12% para anúncios de afiliados. Desconto de tarifa é um valor em R$ abatido da comissão.</p></div>
  <div class="toolbar"><div class="grp"><button class="primary" id="epOk">Salvar</button><button onclick="fecharModal()">Cancelar</button></div>
  ${id?`<div id="epDel" class="sim"><button class="danger" id="epDelBtn">Excluir</button></div>`:''}</div>`);
  if(id)$('#epDelBtn').onclick=()=>{$('#epDel').innerHTML='<span>Excluir este produto?</span> <button class="danger" id="epDelSim">Sim, excluir</button>';$('#epDelSim').onclick=()=>excluirProduto(id);};
  $('#epOk').onclick=()=>salvarProduto(id,p);
}
function salvarProduto(id,orig){
  const g=k=>$('#ep_'+k).value;const num=k=>{const v=parseN(g(k));return isFinite(v)?v:0;};
  const sku=g('sku').trim();if(!sku){toast('Informe o SKU.');return;}
  const doc={...structuredClone(orig),sku,nome:g('nome').trim(),anuncioPremium:g('anuncioPremium').trim()||null,anuncioClassico:g('anuncioClassico').trim()||null,
    L:num('L'),C:num('C'),P:num('P'),peso:num('peso'),cmv:num('cmv'),embalagem:num('embalagem'),overrides:{},precoAtual:{}};
  delete doc.id;
  CANAIS.forEach(k=>{const pa=parseN(g('pa_'+k.id));doc.precoAtual[k.id]=isFinite(pa)&&pa>0?pa:null;
    const o={};const co=parseN(g('co_'+k.id)),ad=parseN(g('ad_'+k.id)),de=parseN(g('de_'+k.id));
    if(isFinite(co))o.comissao=co/100;if(isFinite(ad))o.ads=ad/100;if(isFinite(de)&&de)o.desconto=de;if(Object.keys(o).length)doc.overrides[k.id]=o;});
  if(!id)doc.ordem=(Math.max(0,...S.produtos.map(p=>+p.ordem||0)))+1;
  const ref=id?S.db.doc(`clientes/${S.cid}/produtos/${id}`):S.db.collection(`clientes/${S.cid}/produtos`).doc();
  fecharModal();gravar(ref.path,()=>ref.set(doc).then(()=>toast('Produto salvo.')));
}
function excluirProduto(id){fecharModal();if(S.sel===id)S.sel=null;const path=`clientes/${S.cid}/produtos/${id}`;gravar(path,()=>S.db.doc(path).delete().then(()=>toast('Produto excluído.')));}

/* ---------- Importar ---------- */
function importar(){
  modal(`<h2>Importar do Excel</h2>
  <p class="note">Copie as linhas da planilha (sem o cabeçalho) e cole abaixo. As colunas devem estar nesta ordem:</p>
  <div class="state num" style="font-size:12px">SKU · Nome · Largura · Comprimento · Altura · Peso (kg) · CMV · Embalagem · Preço atual Premium · Preço atual Clássico</div>
  <p class="note">As duas últimas colunas são opcionais. Um SKU que já existe é atualizado, não duplicado.</p>
  <textarea id="imTxt" rows="9" placeholder="B1.100	Fio Bicolor para som - 100m	25	25	7	1,7	51,52	0,65	133,74	102,71"></textarea>
  <div id="imPrev" class="note"></div>
  <div class="sim"><button class="primary" id="imOk" disabled>Importar</button><button onclick="fecharModal()">Cancelar</button></div>`);
  let linhas=[];
  $('#imTxt').addEventListener('input',()=>{linhas=$('#imTxt').value.split(/\r?\n/).map(l=>l.split('\t')).filter(c=>c.length>=7&&c[0].trim());
    $('#imPrev').textContent=linhas.length?`${linhas.length} produtos prontos para importar. Primeiro: ${linhas[0][0]} · ${linhas[0][1]}`:'Nenhuma linha válida. Confira se copiou ao menos 8 colunas do Excel.';$('#imOk').disabled=!linhas.length;});
  $('#imOk').onclick=async()=>{
    const N=v=>{const x=parseN(v);return isFinite(x)?x:0;};const bySku=Object.fromEntries(S.produtos.map(p=>[p.sku,p]));
    let ordem=Math.max(0,...S.produtos.map(p=>+p.ordem||0));$('#imOk').disabled=true;let ok=0;
    for(const c of linhas){const sku=c[0].trim();const ex=bySku[sku];
      const doc={...(ex?structuredClone(ex):{overrides:{},precoAtual:{},ordem:++ordem}),sku,nome:(c[1]||'').trim(),L:N(c[2]),C:N(c[3]),P:N(c[4]),peso:N(c[5]),cmv:N(c[6]),embalagem:N(c[7])};
      delete doc.id;doc.precoAtual={...(doc.precoAtual||{})};if(c[8]&&N(c[8]))doc.precoAtual.ml_premium=N(c[8]);if(c[9]&&N(c[9]))doc.precoAtual.ml_classico=N(c[9]);
      const ref=ex?S.db.doc(`clientes/${S.cid}/produtos/${ex.id}`):S.db.collection(`clientes/${S.cid}/produtos`).doc();
      try{await ref.set(doc);ok++;$('#imPrev').textContent=`Importando… ${ok}/${linhas.length}`;}catch(e){toast(e?.code==='quota_exceeded'?'Limite de armazenamento atingido.':'Falha ao importar '+sku);break;}}
    fecharModal();toast(`${ok} produtos importados.`);};
}

/* ---------- Exportar ---------- */
async function exportar(){
  const c=cli();const ativos=canaisAtivos(c);const m=+c.margem||0;
  const linhas=filtrados().map(p=>{const r={SKU:p.sku,Produto:p.nome,'Anúncio Premium':p.anuncioPremium||'','Anúncio Clássico':p.anuncioClassico||'','Peso cobrado (kg)':+pesoCobrado(p).toFixed(3),CMV:+p.cmv,Embalagem:+p.embalagem};
    ativos.forEach(k=>{const s=precoSugerido(c,k.id,p,S.frete,m);const at=p.precoAtual?.[k.id];const d=at?dre(c,k.id,p,S.frete,at):null;
      r[`${k.nome} · sugerido`]=s==null?'':+s.toFixed(2);r[`${k.nome} · atual`]=at||'';r[`${k.nome} · margem atual`]=d?+d.margem.toFixed(4):'';});return r;});
  const nome=`Precificação ${c.nome} - margem ${pctIn(m)}%`;
  let data,fn;
  if(window.XLSX){const ws=XLSX.utils.json_to_sheet(linhas);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Preços');data=XLSX.write(wb,{bookType:'xlsx',type:'array'});fn=nome+'.xlsx';}
  else{const cols=Object.keys(linhas[0]||{});data=[cols.join(';'),...linhas.map(r=>cols.map(k=>String(r[k]).replace(/;/g,',')).join(';'))].join('\n');fn=nome+'.csv';}
  const dl=await claude.use('downloads');if(!dl){toast('Download indisponível nesta visualização.');return;}
  try{await dl.save({filename:fn,data});}catch(e){if(e?.code!=='declined')toast('Não foi possível gerar o arquivo.');}
}

/* ---------- Rotas e dados ---------- */
function rota(){const h=location.hash.slice(1);S.view=['precos','produtos','parametros'].includes(h)?h:'precos';render();}
addEventListener('hashchange',rota);
function assinarProdutos(){
  if(S.unsubProd)S.unsubProd();S.produtos=[];S.loaded.prod=false;if(!S.cid||!S.db)return;
  S.unsubProd=S.db.collection(`clientes/${S.cid}/produtos`).onSnapshot(snap=>{
    S.produtos=snap.docs.map(d=>({id:d.id,...structuredClone(d.data())})).sort((a,b)=>(+a.ordem||0)-(+b.ordem||0)||String(a.sku).localeCompare(String(b.sku)));
    S.loaded.prod=true;render();},e=>{S.erro='Não foi possível carregar os produtos. Recarregue a página.';render();});
}
(async()=>{
  try{S.cid=localStorage.getItem('prec_cli');}catch{}
  rota();
  const timer=setTimeout(()=>{if(!S.loaded.cli){S.erro='Os dados ainda não responderam. Verifique sua conexão; a página continua tentando.';render();}},10000);
  const db=await claude.use('db');
  if(!db){clearTimeout(timer);S.erro='Entre na sua conta do Claude para usar o Precificador.';render();return;}
  S.db=db;
  db.doc('config/freteML').onSnapshot(d=>{S.frete=d.exists?structuredClone(d.data()):null;S.loaded.frete=true;render();},()=>{});
  db.collection('clientes').onSnapshot(snap=>{
    clearTimeout(timer);if(S.erro&&!S.loaded.cli)S.erro=null;
    S.clientes=snap.docs.map(d=>({id:d.id,...structuredClone(d.data())})).sort((a,b)=>String(a.nome).localeCompare(String(b.nome)));
    const first=!S.loaded.cli;S.loaded.cli=true;
    if(!S.clientes.find(c=>c.id===S.cid)){S.cid=S.clientes[0]?.id||null;assinarProdutos();}
    else if(first)assinarProdutos();
    render();
  },e=>{clearTimeout(timer);S.erro='Não foi possível carregar os clientes.';render();});
})();
</script>
